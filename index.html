    <!-- No production domain exists yet, so canonical/og:url and the
         absolute image URLs below are omitted rather than pointing at a
         domain that doesn't resolve. Once a real domain is live, add:
           <link rel="canonical" href="https://<domain>/" />
           <meta property="og:url" content="https://<domain>/" />
         and swap the relative /og-image.png references below for absolute
         https://<domain>/og-image.png ones (required by some OG/Twitter
         crawlers that don't resolve relative image URLs). -->

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tanvir Ahmed | AI / ML Engineer & Researcher" />
